# E52a (issue #52): learned segment adapters in frozen Déjà View's loop, experiments/LOG.md.
# Second run (15.11): loss over Déjà View's per step, 16 held out, even 3 x 3 grid.
eval: configs/eval_hypersim.yaml     # dev scenes, views, root and the scoring protocol
train_splits: [train, train_extra]   # E41b's 136 scenes; the last `held_out` select the step
skip:                                # E41b's 17, so that the same 136 train scenes are used
  - ai_003_001_cam_00                # Déjà View's rays fit no pinhole (E41b)
  - ai_016_009_cam_00
  - ai_047_006_cam_00                # not prepared for E41b (ai_047_006 and the 14 after
  - ai_048_005_cam_00                # it); prepared on the 3080 on 14.11, left out to keep
  - ai_050_005_cam_00                # E41b's split and held-out scenes
  - ai_052_010_cam_00
  - ai_053_008_cam_00
  - ai_053_013_cam_00
  - ai_053_017_cam_00
  - ai_053_018_cam_00
  - ai_053_019_cam_00
  - ai_054_003_cam_00
  - ai_054_004_cam_00
  - ai_054_010_cam_00
  - ai_055_002_cam_00
  - ai_055_004_cam_00
  - ai_055_008_cam_00
held_out: 16                         # first run 8: 3 scenes where DV fails decided
held_out_views: 12                   # evenly spaced of the 20, the same every evaluation
models:                              # name -> (bias, pool)
  bias: [true, false]
  pool: [false, true]
  both: [true, true]
segments: [gt, grid]                 # grid: even patch tiles per view, the control
grid_tiles: [3, 3]                   # 9 per view (GT median ~13), 180 per pass at 20
                                     # views, under the 192-code cap (first run: 3 x 3
                                     # patch blocks, 108 per view, ~80% dropped)
view_subset: [8, 12]                 # views per training step, drawn uniformly, at most the
                                     # scene's (ai_011_010 has 9, ai_047_008 16 views)
rank: 16                             # pooling's A: 768 -> rank
steps: 3000                          # step 0: ~0.7 s per step at 8-12 views, ~40 min a model
eval_every: 250
lr_bias: 1.0e-3                      # step 0's overfit sweep: bias falls only at 1e-3
lr_pool: 1.0e-5                      # second run's sweep (job 2790): 1e-4 diverges and 3e-5
                                     # rises after step 100 on 120 scenes; 1e-5 still falls
max_error: 0.5                       # relative 3D error clipped above this (E41b)
ratio_floor: 0.0                     # loss = error / max(DV's error, floor); 0: plain ratio
umeyama_pixels: 20000                # per step, for the detached Sim(3)
seed: 0
# E52d (stability diagnosis): the defaults train as E52a's three runs did
autocast: true                       # bf16 forward on CUDA; false: fp32 throughout
weight_decay_up: 0.0                 # AdamW's decoupled decay on B_k only (its cap ~ 1/wd)
clip_factor: null                    # clip the gradient norm at this x the last 100's median
lr_decay: constant                   # or cosine: from the lr to 0 over `steps`
diag_every: 50                       # parameter norms every this many steps
