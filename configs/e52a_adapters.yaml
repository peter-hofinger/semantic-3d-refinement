# E52a (issue #52): learned segment adapters in frozen Déjà View's loop, experiments/LOG.md.
eval: configs/eval_hypersim.yaml     # dev scenes, views, root and the scoring protocol
train_splits: [train, train_extra]   # E41b's 136 scenes; the last `held_out` select the step
skip:                                # E41b's 17, so that the same 136 train scenes are used
  - ai_003_001_cam_00                # Déjà View's rays fit no pinhole (E41b)
  - ai_016_009_cam_00
  - ai_047_006_cam_00                # not prepared for E41b (ai_047_006 and the 14 after
  - ai_048_005_cam_00                # it); prepared on the 3080 on 14.11, left out to keep
  - ai_050_005_cam_00                # E41b's split and held-out scenes
  - ai_052_010_cam_00
  - ai_053_008_cam_00
  - ai_053_013_cam_00
  - ai_053_017_cam_00
  - ai_053_018_cam_00
  - ai_053_019_cam_00
  - ai_054_003_cam_00
  - ai_054_004_cam_00
  - ai_054_010_cam_00
  - ai_055_002_cam_00
  - ai_055_004_cam_00
  - ai_055_008_cam_00
held_out: 8
held_out_views: 12                   # evenly spaced of the 20, the same every evaluation
models:                              # name -> (bias, pool)
  bias: [true, false]
  pool: [false, true]
  both: [true, true]
segments: [gt, grid]                 # grid: 3 x 3 patch tiles per view, the control
grid_block: 3
view_subset: [8, 12]                 # views per training step, drawn uniformly
rank: 16                             # pooling's A: 768 -> rank
steps: 2000                          # set from step 0's timing, see LOG.md
eval_every: 250
lr: 1.0e-3
max_error: 0.5                       # relative 3D error clipped above this (E41b)
umeyama_pixels: 20000                # per step, for the detached Sim(3)
seed: 0
