input: data/processed/scannetpp/5ee7c22ba0/dejaview_k16_views_n20_uniform_504.npz
gt_views: data/processed/scannetpp/5ee7c22ba0/views_n20_uniform_504.npz
views: [13]   # one view: BiNI is per view; cross-view metrics need the multi-view runs
normals: dsine   # dsine | depth (sanity: the input's own normals)
dsine_repo: data/third_party/dsine_hub   # hugoycj/DSINE-hub @ a6b7d25, kept outside git (non-commercial licence)
output_dir: runs
bini:
  k: 2.0
  lambda_depth: 1000.0
  prior_sigma: 4.0   # prior holds only low frequencies (blurred log depth); detail from DSINE
  iters: 150
  tol: 1.0e-4
  cg_iters: 5000
  cg_tol: 1.0e-3
  device: cuda
compare:   # one view under several prior settings
  - {prior_sigma: 0.0, lambda_depth: 1000.0}
  - {prior_sigma: 0.0, lambda_depth: 100.0}
  - {prior_sigma: 4.0, lambda_depth: 1000.0}
  - {prior_sigma: 8.0, lambda_depth: 100.0}
