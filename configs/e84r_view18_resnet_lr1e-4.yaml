# E84r (issue #84): the single-view ResNet run with a tenth of the learning rate and three times the steps: is the stall the rate?
# E84p's/E84o's run (expected Chamfer, Poisson tail, logit gain 1 -> 0.1 over 500 steps, constant Adam 1e-3) on view 18 of the bedroom alone (1 image, 0.2 s per
# step of 2000), its own GT and probes (`KeepScene.view`). Inputs standardized with this one view's statistics where `standardize` is set.
root: data/processed/hypersim
views: views_n20_uniform_504
backbone: dejaview_k16
scenes: [ai_006_007_cam_00]
view: 18
resnet: {width: 64, dilations: [2, 4]}
r: 8
miss: bound
tail: true
temperature:
  start: 1.0
  end: 0.1
  steps: 500
eps: 1.0e-6
steps: 6000
lr: 1.0e-4        # Adam, constant, no weight decay (E84r diagnostic: a tenth of the rate)
chunk: 1
threshold: 0.5
shares: [0.9, 0.7, 0.5, 0.3, 0.2]
eval_every: 300
seed: 0
snapshots: [0, 6000]
standardize: true
