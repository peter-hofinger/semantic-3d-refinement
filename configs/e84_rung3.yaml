# E84 rung 3 (issue #84): overfit ONE sample, view 18 of the bedroom ai_006_007 (docs/experiments.md). The loss must reach the sample's optimum for the net's function class:
# free logits constant on 2 x 2 cells (the free per-pixel optimum is a dither no feature-driven net can copy). No val: an overfit run is judged on its train loss against the optimum; val is logged from rung 5. Nothing else: no logit gain, constant Adam, no weight decay.
name: e84_rung3
root: data/processed/hypersim
views: views_n20_uniform_504
backbone: dejaview_k16
store: cuda       # where the samples live; rung 5 keeps them on the CPU
r: 8              # probes per GT point
miss: bound
tail: true        # Poisson-tail charge of a GT point whose probes are all dropped (E84d)
eps: 1.0e-6
resnet: {width: 64, dilations: [2, 4]}   # 5 convolutions, 190k parameters, 27 x 27 field
lr: 3.0e-4        # a third of E84r's: 1e-3 jitters and can collapse to s = 1 (the 6000-step run)
steps: 3000
batch: 1
seed: 0
eval_every: 100   # full loss of the eval views every eval_every steps
cut_every: 500    # their exact cut Chamfer (the slow metric, KD-trees) every cut_every steps
n_eval: 12        # fixed train views scored in full (loss; exact cut Chamfer every cut_every) every eval_every steps
blocks: [1, 2, 4]  # the optimum of free logits constant on k x k cells, per train view: k = 1 is no network (E84: the bar no smooth net can meet)
free_steps: 400   # free-logit optimum: Adam on each pixel's logit
free_lr: 0.1
train:
  ai_006_007_cam_00: [18]
