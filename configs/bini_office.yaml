input: data/processed/scannetpp/7b6477cb95/dejaview_k16_views_n20_uniform_504.npz
gt_views: data/processed/scannetpp/7b6477cb95/views_n20_uniform_504.npz
view: 6
rays: pinhole   # predicted | pinhole: Déjà View's ray map carries its 14 px patch grid; the pinhole fit does not
normals: dsine   # dsine | depth (sanity: the input's own normals)
dsine_repo: data/third_party/dsine_hub   # hugoycj/DSINE-hub @ a6b7d25, kept outside git (non-commercial licence)
output_dir: runs
bini:
  k: 2.0
  lambda_depth: 100.0   # chosen on office view 6 and kitchen view 13
  prior_sigma: 0.0   # a blurred prior added nothing here and diverged at lambda = 10
  edges: depth   # bilateral (BiNI) | depth: cut on the prior's occlusion contours; bilateral leaves staircases
  edge_tol: 0.02
  iters: 150
  tol: 1.0e-4
  cg_iters: 5000
  cg_tol: 1.0e-3
  device: cuda
compare:   # BiNI's own edges, then occlusion-contour cuts under several depth-prior weights
  - {edges: bilateral, lambda_depth: 100.0}
  - {edges: depth, lambda_depth: 1000.0}
  - {edges: depth, lambda_depth: 100.0}
  - {edges: depth, lambda_depth: 10.0}
