# Evaluation protocol (src/analysis/scene_eval.py): every variant on the same Hypersim
# validation scenes (the dev split of configs/hypersim.yaml; the test split is
# never used), 20 views each at 504 px, Déjà View K = 16, SAM 3 image mode with one
# prompt per NYU40 class at threshold 0.3, linked with the working association, DSINE
# normals on Déjà View's intrinsics (dsine-predict). Scored as labeled clouds on a
# 1 cm grid, each output registered onto the ground truth from the cloud alone:
# accuracy, completeness and F-score at 5 cm for the scene and per class, mIoU, AP50
# (src/evaluation/labeled.py).
output_dir: runs
root: data/processed/hypersim
scenes: [ai_010_007_cam_00, ai_006_007_cam_00, ai_044_001_cam_00]  # living room, bedroom, lobby
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
classes: configs/prompts/nyu40.txt   # evaluated classes: the prompted ones
refine: configs/refine.yaml          # the refined variant: every weight 1, none tuned
variants:
  - name: Déjà View
    refiner: none
  - name: Refined
    refiner: joint
