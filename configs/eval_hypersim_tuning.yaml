# Coarse grid of the joint refinement's weights and budget (Claude.md step 6), on ONE
# scene only: the conference room. The kitchen and the restaurant stay held out; the
# chosen values are then scored on all three by eval_hypersim.yaml.
output_dir: runs
root: data/processed/hypersim
scenes:
- ai_047_009_cam_00
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
classes: configs/prompts/nyu40.txt
refine: configs/refine.yaml
variants:
- name: Déjà View
  refiner: none
- name: λ_mv 0.1
  multiview:
    lambda_mv: 0.1
- name: λ_mv 0.3
  multiview:
    lambda_mv: 0.3
- name: λ_mv 1
  multiview:
    lambda_mv: 1.0
- name: λ_mv 3
  multiview:
    lambda_mv: 3.0
- name: λ_mv 1, mv_tol 0.02
  multiview:
    mv_tol: 0.02
- name: λ_mv 1, mv_tol 0.1
  multiview:
    mv_tol: 0.1
- name: λ_mv 1, 3 Gauss-Newton steps
  multiview:
    gn_iters: 3
- name: λ_mv 1, 30 Gauss-Newton steps
  multiview:
    gn_iters: 30
- name: λ_bd 1 uncut
  refine:
    lambda_bd: 1.0
- name: λ_bd 1 cut
  refine:
    lambda_bd: 1.0
  semantic:
    cut_boundaries: true
- name: λ_bd 10 uncut
  refine:
    lambda_bd: 10.0
- name: λ_bd 10 cut
  refine:
    lambda_bd: 10.0
  semantic:
    cut_boundaries: true
- name: λ_bd 100 uncut
  refine:
    lambda_bd: 100.0
- name: λ_bd 100 cut
  refine:
    lambda_bd: 100.0
  semantic:
    cut_boundaries: true
- name: a, b, λ_δ 0.1
  refine:
    lambda_delta: 0.1
  semantic:
    affine: true
- name: δ only, λ_δ 0.1
  refine:
    lambda_delta: 0.1
- name: a, b, λ_δ 1
  refine:
    lambda_delta: 1.0
  semantic:
    affine: true
- name: δ only, λ_δ 1
  refine:
    lambda_delta: 1.0
- name: a, b, λ_δ 10
  refine:
    lambda_delta: 10.0
  semantic:
    affine: true
- name: δ only, λ_δ 10
  refine:
    lambda_delta: 10.0
