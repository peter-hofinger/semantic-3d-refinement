# E84 rung 5 (issue #84): generalize. Train on 5 views drawn (fixed seed, nested over the sizes) from the 400 views of 20 train scenes, validate on 4 views of each of the 11 val scenes.
# Same net, rate and val as rungs 3 and 4; the samples live on the CPU, a batch of 4 train views and 4 val views per step. Success: the val loss falls as the training set grows and ends below keep-everything.
name: e84_rung5_n5
root: data/processed/hypersim
views: views_n20_uniform_504
backbone: dejaview_k16
store: cpu
r: 8
miss: bound
tail: true
eps: 1.0e-6
resnet: {width: 64, dilations: [2, 4]}
lr: 3.0e-4
steps: 3000
batch: 4
seed: 0
subset_seed: 0    # the permutation of the 400 (scene, view) pairs whose first n_train are the training set
n_train: 5
eval_every: 100
cut_every: 500
n_eval: 44        # the eval views: every val view, and an even spread of the training views
blocks: []        # no optima at this rung (they cost minutes per view)
free_steps: 400
free_lr: 0.1
train:
