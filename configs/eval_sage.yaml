# Evaluation on SAGE-10k (issue #99): same protocol as configs/eval_hypersim.yaml, on the rooms
# `sage-prepare` wrote (configs/sage.yaml); Deja View, SAM 3 and DSINE caches per room as for Hypersim.
output_dir: runs
root: data/processed/sage
dataset: data/processed/sage/splits.yaml   # split -> rooms, written by sage-prepare
aggregated: [train, val]
per_scene: [val]
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
vocabulary: hypersim   # NYU40, the classes sage-prepare maps SAGE's types to
refine: configs/refine.yaml
variants:
  - name: Deja View
    refiner: none
