# The pipeline's joint refiner (run-pipeline --refiner joint, src/refinement/multiview.py):
# E_d + λ_mv E_mv + λ_n E_n + λ_δ‖δ‖² over all views by Gauss-Newton + CG. The linked
# SAM 3 instances weight E_d (confidence x consistency u) and confine E_n and E_mv to one
# instance. λ_d is 1 by definition (E's scale does not move its minimizer); E_n's
# occlusion cut and E_mv's occlusion tolerance are Otsu's threshold of each scene. Every value below
# was checked on dev in E40 (experiments/LOG.md); the solver budget is issue #10's.
refine:
  lambda_mv: 1.0     # 0.3 / 3 trade accuracy against completeness beyond noise (E40)
  lambda_n: 1.0e-4   # E_n's residuals are log-depth steps times the focal length (#21)
  lambda_delta: 1.0  # 0 is singular; 0.3 / 3 trade as λ_mv does (E40)
  neighbors: 4       # views each view is matched with; all 19 exceed 10 GB (E40)
  gn_iters: 10       # Gauss-Newton steps of 20 CG iterations (#10)
  cg_iters: 20
  cg_tol: 0.001
  device: cuda       # falls back to the CPU without a GPU
# DSINE for E_n: non-commercial licence, so code and weights stay outside git.
dsine_repo: data/third_party/dsine_hub   # hugoycj/DSINE-hub @ a6b7d25
