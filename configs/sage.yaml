# SAGE-10k (issue #99): download, rendering and NYU40 classes. Paths are relative to the repo root.

repo: nvidia/SAGE-10k
revision: d425de49ff445fd3903d790a11461d23ffd0c7dd   # pinned dataset commit (scenes and kits)
raw_root: data/sage/raw                 # unzipped rooms: <layout>/{layout_*.json, objects, materials}
kit_root: data/third_party/sage         # the dataset's kits/ at the pinned revision (Apache-2.0)
output_root: data/processed/sage        # views and ground truth (.npz), same format as Hypersim

rooms: 100          # how many rooms to download and render (100 to 1000 planned; 50 MB each raw)
held_out: 10        # the last rooms of the list: SAGE's val split, never trained on
seed: 0             # which rooms (evenly spaced over the sorted list, offset by the seed) and camera paths

render:
  num_frames: 20            # views per room, evenly spaced along SAGE's camera path
  path_frames: 300          # poses of the planned path (SAGE's default)
  path_anchors: 25          # viewpoints the path visits (SAGE's default `complexity`)
  width: 504
  height: 378               # Hypersim's 4:3 at our 504 px long side
  fov_x_deg: 60.0           # Hypersim's horizontal field of view; principal point centred
  samples: 64               # Cycles samples per pixel, denoised
  device: GPU               # GPU (OptiX/CUDA, Metal on a Mac) or CPU

# NYU40 class of an object from its SAGE type ("floorlamp", "deskpen", "book_shelf"): the type is
# lower-cased, digits and separators dropped, and cut into the longest known words from the left.
# A word of a class in `props` wins over a furniture word, since glued types name the item and
# where it stands ("deskpen", "bookshelfbook", "booksideboard"); among equals the last word wins.
# Words mapped to null only help the cut ("coffee", "upper"). No known class word: otherprop.
props: [books, paper, pillow, towel, clothes, bag, box, lamp, picture, mirror, television,
        floor mat, whiteboard, otherprop]
