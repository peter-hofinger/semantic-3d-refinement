# L-BFGS against Gauss-Newton + CG (benchmark.py) on E_d + E_n, every view alone, and E_d + E_n + E_mv, all 20
# views together, on ETH3D office and kicker. Both solvers minimize the same energy (multiview.scene_residuals) on
# the same fixed problem (DSINE normals, occlusion cuts, matches) from δ = 0; only the optimizer differs. Weights
# and data as in eval_multiview.yaml, set before this run.
scenes:
  office:
    input: data/processed/eth3d/office/dejaview_k16_views_n20_uniform_504.npz
    gt_views: data/processed/eth3d/office/views_n20_uniform_504.npz
    scan: data/processed/eth3d/office/scan.npy
  kicker:
    input: data/processed/eth3d/kicker/dejaview_k16_views_n20_uniform_504.npz
    gt_views: data/processed/eth3d/kicker/views_n20_uniform_504.npz
    scan: data/processed/eth3d/kicker/scan.npy
rays: pinhole
normals: dsine
dsine_repo: data/third_party/dsine_hub   # hugoycj/DSINE-hub @ a6b7d25, kept outside git (non-commercial licence)
output_dir: runs
credit: "Images and laser scans: ETH3D (Schöps et al., CVPR 2017), CC BY-NC-SA 4.0; the figure is derived from it under the same licence."   # data source, quoted in the figure README
tolerances_cm: [1, 2, 5, 10, 20]
refine:
  lambda_d: 1.0
  lambda_bd: 0.0
  lambda_n: 0.005
  lambda_delta: 0.0
  edge_tol: 0.02
  device: cuda
multiview:
  mv_tol: 0.05
  neighbors: 4
  cg_iters: 20
  cg_tol: 0.001
setups:   # λ_mv per setup: monocular has no cross-view term, so its views are independent
  monocular: 0.0
  multi-view: 1.0
# Gauss-Newton runs past the 10 steps of eval_multiview.yaml so both solvers are traced to convergence; the 10-step
# operating point is scored as well.
gn_iters: 40
gn_operating_point: 10
lbfgs:
  history_size: 20          # as monocular.py
  chunk: 20                 # iterations between energy and time readings
  max_iters: 3000
  max_seconds: 300
  rel_change: 1.0e-7        # stop when E changes by less than this (relative) over one chunk
# Converged: E within this fraction of E* (relative), E* the lowest energy either solver reached in that setup.
converged_frac: 0.01
