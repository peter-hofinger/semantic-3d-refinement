[project]
name = "semantic-3d-refinement"
version = "0.1.0"
description = "Semantic-guided geometry refinement and post-optimization for feed-forward 3D reconstruction models (VGGT, DejaView, DA3)"
readme = "README.md"
authors = [
    { name = "peter-hofinger", email = "hofinger-peter@gmx.de" }
]
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.23.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
]

[project.scripts]
semantic-3d-refinement = "semantic_3d_refinement:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tqdm>=4.70.1",
]
normals = [
    "geffnet>=1.0.2",
    "torchvision>=0.29.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # incorrect blank line before class
    "D213",  # multi line summary second line
    "S101",  # design by contract: asserts are the point
    "PT018",  # composite contract asserts
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "INP001", "PLR2004"]
