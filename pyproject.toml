[project]
name = "semantic-3d-refinement"
version = "0.1.0"
description = "Semantic-guided geometry refinement and post-optimization for feed-forward 3D reconstruction models (VGGT, DejaView, DA3)"
readme = "README.md"
authors = [
    { name = "peter-hofinger", email = "hofinger-peter@gmx.de" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.1",
]

[project.scripts]
semantic-3d-refinement = "semantic_3d_refinement:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "ruff>=0.17.1",
    "tqdm>=4.70.1",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # incorrect blank line before class
    "D213",  # multi line summary second line
]
