[project]
name = "semantic-3d-refinement"
version = "0.1.0"
description = "Semantic-guided geometry refinement and post-optimization for feed-forward 3D reconstruction models (VGGT, DejaView, DA3)"
readme = "README.md"
authors = [
    { name = "peter-hofinger", email = "hofinger-peter@gmx.de" },
    { name = "Pouya Esfahani", email = "pouya.esfahani@tum.de" },
]
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.50.2 ; sys_platform != 'darwin'",
    "dvlt",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[project.scripts]
semantic-3d-refinement = "src:main"
scannetpp-download = "src.loaders.scannetpp.download:main"
scannetpp-prepare = "src.loaders.scannetpp.prepare:main"
scannetpp-render-gt = "src.loaders.scannetpp.gt:main"
run-pipeline = "src.pipeline:main"
dejaview-predict = "src.backbone.dejaview:main"
sam3-segment = "src.segmentation.sam3:main"
vlm-vocabulary = "src.segmentation.vocabulary:main"
eval-instances = "src.evaluation.instances:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# the code lives directly in src/ and is imported as `src`
[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
dvlt = { git = "https://github.com/nv-tlabs/dvlt", rev = "f59bb18" }
# CUDA builds on Linux/Windows, default PyPI wheels on macOS
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# dvlt pins exact old versions; use ours instead
[tool.uv]
override-dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.21",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
    "tqdm>=4.70.1",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.31.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tqdm>=4.70.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # incorrect blank line before class
    "D213",    # multi line summary second line
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header per file (LICENSE covers it)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # pytest uses assert
    "PLR2004",  # literal values in tests
    "INP001",   # tests is not a package
    "D",        # no docstrings needed in tests
]
"experiments/**/*.py" = [
    "T201",     # experiment scripts report with print
    "INP001",   # scripts, not a package
    "E402",     # matplotlib backend is set before pyplot is imported
    "S101",     # asserts are fine in one-off checks
    "PLR2004",  # literal values in one-off checks
    "E501",     # long report lines
]
"notebooks/**/*.ipynb" = [
    "T201",     # print is fine in notebooks
    "D",        # no docstrings needed in notebooks
    "INP001",   # notebooks are not a package
]

[tool.ruff.format]
docstring-code-format = true
