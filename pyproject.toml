[project]
name = "semantic-3d-refinement"
version = "0.1.0"
description = "Semantic-guided refinement of feed-forward 3D reconstruction (Déjà View), evaluated on Hypersim"
readme = "README.md"
authors = [
    { name = "Pouya Shekarchizadeh Esfahani", email = "pouya.esfahani@tum.de" },
    { name = "Peter Hofinger", email = "peter.hofinger@tum.de" },
    { name = "Mircea-Alexandru Răuțoiu", email = "mircea.rautoiu@tum.de" },
]
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.23.1",
    "bitsandbytes>=0.50.2 ; sys_platform != 'darwin'",
    "dvlt",
    "h5py>=3.16",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "open3d>=0.19",
    "pillow>=13.0.0",
    "py7zr>=1.1.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34",
    "scipy>=1.16",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[project.scripts]
scannetpp-download = "src.loaders.scannetpp.download:main"
scannetpp-prepare = "src.loaders.scannetpp.prepare:main"
scannetpp-render-gt = "src.loaders.scannetpp.gt:main"
hypersim-download = "src.loaders.hypersim.download:main"
hypersim-prepare = "src.loaders.hypersim.prepare:main"
eth3d-download = "src.loaders.eth3d.download:main"
eth3d-prepare = "src.loaders.eth3d.prepare:main"
kitti360-prepare = "src.loaders.kitti360.prepare:main"
tanksandtemples-prepare = "src.loaders.tanksandtemples.prepare:main"
run-pipeline = "src.pipeline:main"
dejaview-predict = "src.backbone.dejaview:main"
segvggt-predict = "src.backbone.segvggt:main"
dsine-predict = "src.refinement.normals:main"
learned-refine = "src.refinement.learned:main"
volume-refine = "src.refinement.volume:main"
sam3-segment = "src.segmentation.sam3:main"
vlm-vocabulary = "src.segmentation.vocabulary:main"
eval-instances = "src.evaluation.instances:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# the code lives directly in src/ and is imported as `src`
[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
dvlt = { git = "https://github.com/nv-tlabs/dvlt", rev = "f59bb18" }
# CUDA builds on Linux/Windows, default PyPI wheels on macOS
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# dvlt pins exact old versions; use ours instead
[tool.uv]
override-dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.21",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "matplotlib>=3.11.2",
    "tqdm>=4.70.1",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tqdm>=4.70.1",
]
normals = [  # DSINE (data/third_party/dsine_hub, not in git)
    "geffnet>=1.0.2",
]
segvggt = [
    "einops>=0.8.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # incorrect blank line before class
    "D213",    # multi line summary second line
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright header per file (LICENSE covers it)
    "TC001",   # annotation imports stay at runtime: beartype resolves them
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # pytest uses assert
    "PLR2004",  # literal values in tests
    "INP001",   # tests is not a package
    "D",        # no docstrings needed in tests
]
"experiments/**/*.py" = [
    "T201",     # experiment scripts report with print
    "INP001",   # scripts, not a package
    "E402",     # matplotlib backend is set before pyplot is imported
    "S101",     # asserts are fine in one-off checks
    "PLR2004",  # literal values in one-off checks
    "E501",     # long report lines
    # each script is a frozen record of one experiment, read top to bottom next to
    # its LOG.md entry; splitting its main into helpers would change code whose
    # output is committed, for no reader
    "C901",     # complex-structure
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
]
# design by contract: asserts state shapes, ranges and finiteness on entry and exit
"src/{analysis/*,refinement/{multiview,normals,learned,volume},evaluation/labeled,backbone/segvggt}.py" = [
    "S101",     # contract asserts
    "PT018",    # composite contract asserts
]
"src/analysis/*.py" = [
    "E501",     # figure captions, slide text and README tables as long f-strings
]
# the ETH3D, KITTI-360 and Tanks and Temples loaders state their calibration and depth
# contracts the same way
"src/loaders/{eth3d,kitti360,tanksandtemples}/*.py" = [
    "S101",     # contract asserts
]
"src/loaders/kitti360/*.py" = [
    "PT018",    # composite contract asserts
]
"tests/test_{labeled,multiview,normals,segvggt,learned,volume}.py" = [
    "PT018",    # composite contract asserts
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]  # third-party clones in data/ ship their own test files
