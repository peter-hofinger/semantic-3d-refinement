# E8c (experiments/LOG.md, issue #8): is SAM 3's gate just a residual detector? No
# segments, but E_mv keeps only the matches with the smallest initial |residual|, as
# many per scene as SAM 3's (or the permuted ids') gate keeps (`keep_like`,
# `keep_by: residual`), next to E8b's random cut and gate only.
# `--splits dev val stress`. Otherwise configs/eval_hypersim.yaml's protocol.
output_dir: runs
root: data/processed/hypersim
dataset: configs/hypersim.yaml
aggregated: [dev, val, test]
per_scene: [dev, val, stress]
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
vocabulary: hypersim
refine: configs/refine.yaml
variants:
  - name: Déjà View
    refiner: none
  - name: "Off"
    refiner: joint
    segments: none
  - name: SAM 3
    refiner: joint
    segments: sam3
  - name: random @ SAM 3, seed 0
    refiner: joint
    segments: none
    keep_like: sam3
    seed: 0
  - name: gate only
    refiner: joint
    segments: none
    gate: sam3
  - name: residual @ SAM 3
    refiner: joint
    segments: none
    keep_like: sam3
    keep_by: residual
  - name: residual @ permuted
    refiner: joint
    segments: none
    keep_like: permuted
    keep_by: residual
