# E40 (experiments/LOG.md, issue #28), attribution after the val check: the final energy
# written with the sweep's knobs (run at caea80c, which has them), and that energy with
# each adopted change undone, one at a time. Dev only: `--splits dev`.
# Reads RefineConfig's sweep knobs, which exist from d8675a5 to caea80c only: run at caea80c.
# Evaluation protocol (src/analysis/scene_eval.py): every variant on the scenes of
# configs/hypersim.yaml's splits, chosen by --splits, 20 views each at 504 px, Déjà View
# K = 16, SAM 3 image mode with the prompts of configs/prompts/nyu40.txt at threshold 0.3
# (all NYU40 classes but the three catch-alls, which still count in the scores), linked with
# the working association, DSINE normals on Déjà View's intrinsics (dsine-predict). Each
# output, a labeled point per pixel, aligned onto the ground truth by Umeyama on the
# pixels: accuracy, completeness, Chamfer, mIoU, PQ, AP, for the scene and per class
# (src/evaluation/labeled.py).
output_dir: runs
root: data/processed/hypersim
dataset: configs/hypersim.yaml       # the scenes of each split
aggregated: [dev, val, test]         # splits that get a split aggregate
per_scene: [dev, val, stress]        # splits that also keep per-scene scores
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
vocabulary: hypersim   # evaluated classes: the dataset's full label set, all 40 NYU40 classes
refine: configs/refine.yaml          # the refined variant: every weight 1, none tuned
variants:
  - name: Déjà View
    refiner: none
  - name: Refined
    refiner: joint
  - name: final
    refiner: joint
    refine: {huber: .inf, conf_power: 0.0, border: 0, edge_tol: null}
  - name: final, Huber 0.05 back
    refiner: joint
    refine: {huber: 0.05, conf_power: 0.0, border: 0, edge_tol: null}
  - name: final, confidence back
    refiner: joint
    refine: {huber: .inf, conf_power: 1.0, border: 0, edge_tol: null}
  - name: final, 1 px border back
    refiner: joint
    refine: {huber: .inf, conf_power: 0.0, border: 1, edge_tol: null}
  - name: final, edge_tol 0.02 back
    refiner: joint
    refine: {huber: .inf, conf_power: 0.0, border: 0, edge_tol: 0.02}
