# E40 (experiments/LOG.md, issue #28): configs/eval_hypersim.yaml with each hand-set
# constant of the energy varied alone from configs/refine.yaml; null derives it from
# Otsu's occlusion threshold. Run on dev only: `--splits dev`.
# Evaluation protocol (src/analysis/scene_eval.py): every variant on the scenes of
# configs/hypersim.yaml's splits, chosen by --splits, 20 views each at 504 px, Déjà View
# K = 16, SAM 3 image mode with the prompts of configs/prompts/nyu40.txt at threshold 0.3
# (all NYU40 classes but the three catch-alls, which still count in the scores), linked with
# the working association, DSINE normals on Déjà View's intrinsics (dsine-predict). Each
# output, a labeled point per pixel, aligned onto the ground truth by Umeyama on the
# pixels: accuracy, completeness, Chamfer, mIoU, PQ, AP, for the scene and per class
# (src/evaluation/labeled.py).
output_dir: runs
root: data/processed/hypersim
dataset: configs/hypersim.yaml       # the scenes of each split
aggregated: [dev, val, test]         # splits that get a split aggregate
per_scene: [dev, val, stress]        # splits that also keep per-scene scores
views: views_n20_uniform_504
backbone: dejaview_k16
segmentation: sam3image-nyu40-t0.3
vocabulary: hypersim   # evaluated classes: the dataset's full label set, all 40 NYU40 classes
refine: configs/refine.yaml          # the refined variant: every weight 1, none tuned
variants:
  - name: Déjà View
    refiner: none
  - name: Refined
    refiner: joint
  - name: Refined, repeat
    refiner: joint
  - name: huber quadratic
    refiner: joint
    refine: {huber: .inf}
  - name: huber Otsu
    refiner: joint
    refine: {huber: null}
  - name: huber 0.02
    refiner: joint
    refine: {huber: 0.02}
  - name: huber 0.1
    refiner: joint
    refine: {huber: 0.1}
  - name: no consistency u
    refiner: joint
    refine: {consistency: false}
  - name: neighbors 2
    refiner: joint
    refine: {neighbors: 2}
  - name: neighbors 8
    refiner: joint
    refine: {neighbors: 8}
  - name: neighbors all
    refiner: joint
    refine: {neighbors: 19}
  - name: border 0 px
    refiner: joint
    refine: {border: 0}
  - name: edge_tol 0.01
    refiner: joint
    refine: {edge_tol: 0.01}
  - name: edge_tol 0.05
    refiner: joint
    refine: {edge_tol: 0.05}
  - name: edge_tol Otsu
    refiner: joint
    refine: {edge_tol: null}
  - name: window 3
    refiner: joint
    refine: {cut_window: 3}
  - name: window 5
    refiner: joint
    refine: {cut_window: 5}
  - name: window 11
    refiner: joint
    refine: {cut_window: 11}
  - name: no closing
    refiner: joint
    refine: {close_budget: 0.0}
  - name: closing 2 x window
    refiner: joint
    refine: {close_budget: 14.0}
  - name: lambda_delta 0.3
    refiner: joint
    refine: {lambda_delta: 0.3}
  - name: lambda_delta 3
    refiner: joint
    refine: {lambda_delta: 3.0}
  - name: lambda_mv 0.3
    refiner: joint
    refine: {lambda_mv: 0.3}
  - name: lambda_mv 3
    refiner: joint
    refine: {lambda_mv: 3.0}
