# E57a (issue #57, experiments/LOG.md): one keep-head model of configs/e57a_volume*.yaml, scored as a backbone
# (its depth: Deja View's for volume-keep-*, refined for volume-keepres-*), whole and cut to half its pixels,
# once by instance voxel density (E45's filter, E27a's flag) and once by its own keep logit
# (<model>_keep_<views>.npz). The run script replaces MODEL by the model's name: `--splits dev val`.
# Evaluation protocol (src/analysis/scene_eval.py): every variant on the scenes of
# configs/hypersim.yaml's splits, chosen by --splits, 20 views each at 504 px, Déjà View
# K = 16, SAM 3 image mode with the prompts of configs/prompts/nyu40.txt at threshold 0.3
# (all NYU40 classes but the three catch-alls, which still count in the scores), linked with
# the working association. Each output, a labeled point per pixel, aligned onto the ground
# truth by Umeyama on the pixels: accuracy, completeness, Chamfer, mIoU, PQ, AP, for the
# scene and per class (src/evaluation/labeled.py).
output_dir: runs
root: data/processed/hypersim
dataset: configs/hypersim.yaml       # the scenes of each split
aggregated: [dev, val, test]         # splits that get a split aggregate
per_scene: [dev, val, stress]        # splits that also keep per-scene scores
views: views_n20_uniform_504
backbone: MODEL
segmentation: sam3image-nyu40-t0.3
vocabulary: hypersim   # evaluated classes: the dataset's full label set, all 40 NYU40 classes
refine: configs/refine.yaml          # unused: no variant refines
variants:
  - name: MODEL
    refiner: none
  - name: MODEL, kept 0.5 by density
    refiner: none
    keep: 0.5
  - name: MODEL, kept 0.5 by keep head
    refiner: none
    keep: 0.5
    keep_by: MODEL_keep
